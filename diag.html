<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>顯示檢查</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>body{padding:20px;font-size:16px} pre{white-space:pre-wrap;background:#fff;border:1px solid #ccc;border-radius:12px;padding:14px;font-size:14px;line-height:1.6} .ref{font-size:20px;border:1px dashed #999;display:inline-block}</style>
  </head>
  <body>
    <h1 style="font-size:22px">顯示檢查（給網站維護用）</h1>
    <p>請截圖這個畫面傳給我。</p>
    <p class="ref">一一一一一一一一一一</p>
    <pre id="out">計算中…</pre>
    <script src="./site.js"></script>
    <script>
      setTimeout(function () {
        var probe = document.querySelector(".ref");
        var r = document.documentElement;
        var p2 = document.createElement("span");
        p2.textContent = "一一一一一一一一一一";
        p2.style.cssText = "position:absolute;left:-9999px;font-size:20px;white-space:nowrap";
        document.body.appendChild(p2);
        document.getElementById("out").textContent = [
          "text-scaled: " + r.classList.contains("text-scaled"),
          "--ts: " + (r.style.getPropertyValue("--ts") || "(none)"),
          "in-flow 20px x10 width: " + probe.getBoundingClientRect().width.toFixed(1) + " (expect 200)",
          "in-flow computed font-size: " + getComputedStyle(probe).fontSize,
          "hidden probe width: " + p2.getBoundingClientRect().width.toFixed(1),
          "hidden probe font-size: " + getComputedStyle(p2).fontSize,
          "window: " + innerWidth + " x " + innerHeight + ", DPR " + devicePixelRatio,
          "UA: " + navigator.userAgent
        ].join("\n");
      }, 800);
    </script>
  </body>
</html>
